[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "strux-rs"
version = "0.4.0"
description = "A performance-engineered structural biology library in Rust"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "QntmSeer", email = "qntmqrks@gmail.com" }
]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: MIT License",
]

