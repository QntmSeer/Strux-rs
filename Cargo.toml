[package]
name = "strux-rs"
version = "0.3.1"
edition = "2021"
authors = ["QntmSeer <qntmqrks@gmail.com>"]
license = "MIT"
repository = "https://github.com/QntmSeer/strux-rs"

[lib]
name = "strux_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
numpy = "0.21.0"
rayon = "1.10.0"
nalgebra = { version = "0.33.0", default-features = false, features = ["std"] }
memmap2 = "0.9.5"
cudarc = { version = "0.11", optional = true, default-features = false, features = ["driver", "cuda-12050"] }

[features]
default = []
cuda = ["dep:cudarc"]

