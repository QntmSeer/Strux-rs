name: Build & Publish Multi-Platform Wheels

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ptx:
    # Compile the CUDA kernel to PTX with NVRTC (no GPU or nvcc needed). NVRTC 12.5 emits
    # PTX ISA 8.5, matching cudarc's cuda-12050 bindings (driver supporting CUDA 12.5+).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile qcp.cu to PTX
        run: |
          pip install "cuda-python>=12.9,<13" "nvidia-cuda-nvrtc-cu12==12.5.*"
          python compile_ptx.py
          grep -c "^.visible .entry" src/cuda/kernels/qcp.ptx
      - uses: actions/upload-artifact@v4
        with:
          name: qcp-ptx
          path: src/cuda/kernels/qcp.ptx

  linux:
    needs: ptx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qcp-ptx
          path: src/cuda/kernels
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --features cuda --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: dist

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build macOS Apple Silicon wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: dist

  windows:
    needs: ptx
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qcp-ptx
          path: src/cuda/kernels
      - name: Build Windows x64 wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --features cuda --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [linux, macos, windows, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
